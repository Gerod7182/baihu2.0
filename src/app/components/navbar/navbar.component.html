<header class="main-header">
  <div class="header-container">

    <div class="logo">
      <a routerLink="/">
        <span class="logo-text">BAIHUART</span>
      </a>
    </div>

    <nav class="main-nav">
      <ul class="nav-list">
        <li><a routerLink="/" id="nav-tienda">{{ textos['nav-tienda'] }}</a></li>
        <li><a routerLink="/galeria" id="nav-galeria">{{ textos['nav-galeria'] }}</a></li>
        <li><a routerLink="/ofertas" id="nav-ofertas">{{ textos['nav-ofertas'] }}</a></li>
      </ul>
    </nav>

    <div class="search-box">
      <i class="fas fa-search search-icon"></i>
      <input
        type="text"
        class="search-input"
        id="barra-busqueda"
        [placeholder]="textos['buscar-placeholder']"
      />
    </div>

    <div class="icon-group">
      <a href="https://github.com/Gerod7182/baihuart-code" target="_blank" rel="noopener noreferrer" title="Ver Código en GitHub">
        <i class="fab fa-github"></i>
      </a>

    <div class="lang-container" (click)="toggleLangMenu()">

  <div class="lang-icon">
    🌐
  </div>

  <div class="lang-menu" *ngIf="menuAbierto">

    <div (click)="seleccionarIdioma('es')">🇪🇸 Español</div>
    <div (click)="seleccionarIdioma('en')">🇺🇸 English</div>
    <div (click)="seleccionarIdioma('pt')">🇧🇷 Português</div>

  </div>

</div>

      <a routerLink="/login" class="user-link">
        <i class="fas fa-user"></i>
        <span id="nombreUsuarioHeader">{{ nombreUsuario }}</span>
      </a>

      <button
        *ngIf="mostrarLogout"
        (click)="cerrarSesion()"
        class="logout-btn"
        id="btn-logout"
      >
        Cerrar Sesión
      </button>

      <a routerLink="/carrito" class="cart" title="Carrito">
  <i class="fas fa-shopping-cart"></i>

  <!-- 🔥 solo aparece si hay productos -->
  <span class="cart-count" *ngIf="cartCount > 0">
    {{ cartCount }}
  </span>
</a>
    </div>

  </div>
</header>
