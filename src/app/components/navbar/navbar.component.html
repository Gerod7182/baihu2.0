<header class="main-header">
  <div class="header-container">

    <div class="logo">
      <a routerLink="/">
        <span class="logo-text">BAIHUART</span>
      </a>
    </div>

    <div class="search-box">
      <i class="fas fa-search search-icon"></i>
      <input
        type="text"
        class="search-input"
        id="barra-busqueda"
        [placeholder]="textos['buscar-placeholder']"
      />
    </div>

    <div class="icon-group">
      <a href="https://github.com/Gerod7182/baihuart-code" target="_blank" rel="noopener noreferrer" title="Ver Código en GitHub">
        <i class="fab fa-github"></i>
      </a>

      <div class="lang-container" (click)="toggleLangMenu()">
        <div class="lang-icon">🌐</div>
        <div class="lang-menu" *ngIf="menuAbierto">
          <div (click)="seleccionarIdioma('es')">🇪🇸 Español</div>
          <div (click)="seleccionarIdioma('en')">🇺🇸 English</div>
          <div (click)="seleccionarIdioma('pt')">🇧🇷 Português</div>
        </div>
      </div>
    </div>

  </div>
</header>

<!-- =========================
     BARRA DE NAVEGACIÓN INFERIOR (estilo app)
========================= -->
<nav class="bottom-tabbar">

  <a routerLink="/" routerLinkActive="tab-active" [routerLinkActiveOptions]="{exact: true}" class="tab-item">
    <i class="fas fa-store"></i>
    <span>{{ textos['nav-tienda'] }}</span>
  </a>

  <a routerLink="/galeria" routerLinkActive="tab-active" class="tab-item">
    <i class="fas fa-images"></i>
    <span>{{ textos['nav-galeria'] }}</span>
  </a>

  <a routerLink="/ofertas" routerLinkActive="tab-active" class="tab-item">
    <i class="fas fa-tags"></i>
    <span>{{ textos['nav-ofertas'] }}</span>
  </a>

  <a routerLink="/carrito" routerLinkActive="tab-active" class="tab-item">
    <div class="tab-icon-wrap">
      <i class="fas fa-shopping-cart"></i>
      <span class="cart-count" *ngIf="cartCount > 0">{{ cartCount }}</span>
    </div>
    <span>Carrito</span>
  </a>

  <a *ngIf="!usuarioLogueado" routerLink="/login" routerLinkActive="tab-active" class="tab-item">
    <i class="fas fa-user"></i>
    <span>Cuenta</span>
  </a>

  <a *ngIf="usuarioLogueado" routerLink="/cuenta" routerLinkActive="tab-active" class="tab-item">
    <i class="fas" [ngClass]="iconoUsuario"></i>
    <span>Cuenta</span>
  </a>

</nav>
