<header class="main-header">
  <div class="header-container">

    <div class="logo">
      <a routerLink="/">
        <span class="logo-text">BAIHUART</span>
      </a>
    </div>

    <nav class="main-nav">
      <ul class="nav-list">
        <li><a routerLink="/" id="nav-tienda">{{ textos['nav-tienda'] }}</a></li>
        <li><a routerLink="/galeria" id="nav-galeria">{{ textos['nav-galeria'] }}</a></li>
        <li><a routerLink="/ofertas" id="nav-ofertas">{{ textos['nav-ofertas'] }}</a></li>
      </ul>
    </nav>

    <div class="search-box">
      <i class="fas fa-search search-icon"></i>
      <input
        type="text"
        class="search-input"
        id="barra-busqueda"
        [placeholder]="textos['buscar-placeholder']"
      />
    </div>

    <div class="icon-group">
      <a href="https://github.com/Gerod7182/baihuart-code" target="_blank" rel="noopener noreferrer" title="Ver Código en GitHub">
        <i class="fab fa-github"></i>
      </a>

    <div class="lang-container" (click)="toggleLangMenu()">

  <div class="lang-icon">
    🌐
  </div>

  <div class="lang-menu" *ngIf="menuAbierto">

    <div (click)="seleccionarIdioma('es')">🇪🇸 Español</div>
    <div (click)="seleccionarIdioma('en')">🇺🇸 English</div>
    <div (click)="seleccionarIdioma('pt')">🇧🇷 Português</div>

  </div>

</div>

      <div class="user-menu-container" style="position: relative;">

        <a *ngIf="!usuarioLogueado" routerLink="/login" class="user-link">
          <i class="fas fa-user"></i>
        </a>

        <div *ngIf="usuarioLogueado" (click)="toggleUserMenu()" style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
          <i class="fas" [ngClass]="iconoUsuario" style="color: white;"></i>
        </div>

        <div *ngIf="usuarioLogueado && menuUsuarioAbierto" style="position: absolute; right: 0; top: 35px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; min-width: 220px; z-index: 100; box-shadow: 0 8px 20px rgba(0,0,0,0.5);">

          <div style="padding: 14px; border-bottom: 1px solid #333;">
            <div style="color: white; font-weight: bold;">{{ nombreUsuario }}</div>
            <div style="color: #999; font-size: 0.8rem;">{{ correoUsuario }}</div>
          </div>

          <a *ngIf="esAdmin" routerLink="/admin" (click)="menuUsuarioAbierto = false" style="display: block; padding: 10px 14px; color: #ff4444; font-weight: bold; text-decoration: none;">
            <i class="fas fa-lock" style="margin-right: 8px;"></i>Panel Admin
          </a>

          <div (click)="cerrarSesion()" style="padding: 10px 14px; color: #ccc; cursor: pointer;">
            <i class="fas fa-sign-out-alt" style="margin-right: 8px;"></i>Cerrar Sesión
          </div>

        </div>

      </div>

      <a routerLink="/carrito" class="cart" title="Carrito">
  <i class="fas fa-shopping-cart"></i>

  <!-- 🔥 solo aparece si hay productos -->
  <span class="cart-count" *ngIf="cartCount > 0">
    {{ cartCount }}
  </span>
</a>
    </div>

  </div>
</header>
