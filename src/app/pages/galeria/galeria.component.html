<section class="galeria-page">

  <section class="hero-galeria">
    <div class="hero-content">
      <h1 class="hero-title">{{ textos['galeria-titulo'] }}</h1>
    </div>
  </section>

  <div class="container">

    <nav class="gallery-filters">
      <button class="filter-btn" [class.active]="filtroActivo === 'todos'" (click)="filtrar('todos')">
        {{ textos['filtro-todos'] }}
      </button>
      <button class="filter-btn" [class.active]="filtroActivo === 'espiritual'" (click)="filtrar('espiritual')">
        {{ textos['filtro-espiritual'] }}
      </button>
      <button class="filter-btn" [class.active]="filtroActivo === 'anime'" (click)="filtrar('anime')">
        {{ textos['filtro-anime'] }}
      </button>
      <button class="filter-btn" [class.active]="filtroActivo === 'pop'" (click)="filtrar('pop')">
        {{ textos['filtro-pop'] }}
      </button>
    </nav>

    <div class="masonry-grid">
      <ng-container *ngFor="let item of itemsGaleria">
        <div class="masonry-item" *ngIf="mostrarItem(item.categoria)">
          <figure (click)="abrirModal(item.img, textos[item.tituloKey], textos[item.descKey])">
            <img [src]="item.img" [alt]="textos[item.tituloKey]">
            <figcaption>{{ textos[item.tituloKey] }}</figcaption>
          </figure>
        </div>
      </ng-container>
    </div>

  </div>

  <div class="modal-overlay" *ngIf="modalAbierto" (click)="cerrarModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <button class="close-btn" (click)="cerrarModal()">&times;</button>
      <img [src]="imagenSeleccionada" alt="Ampliada">
      <div class="modal-info">
        <h3>{{ tituloSeleccionado }}</h3>
        <p>{{ descSeleccionada }}</p>
      </div>
    </div>
  </div>

</section>
