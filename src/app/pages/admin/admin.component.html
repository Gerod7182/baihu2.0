<section class="admin-section" style="padding: 6rem 2rem; background: #111; color: white; min-height: 80vh; text-align: center;">
  
  <h1 style="font-family: 'Orbitron'; color: #ff3223; margin-bottom: 2rem;">Panel de Administración</h1>

  <div class="form-container" style="max-width: 500px; margin: auto; background: #222; padding: 2rem; border-radius: 10px;">
    
    <div style="margin-bottom: 1rem; text-align: left;">
      <label>Nombre:</label>
      <input [(ngModel)]="producto.nombre" type="text" placeholder="Ej: Camiseta Nueva" style="width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: white;">
    </div>

    <div style="margin-bottom: 1rem; text-align: left;">
      <label>Código (único):</label>
      <input [(ngModel)]="producto.codigo" type="text" placeholder="Ej: prod-cam-nueva" style="width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: white;">
    </div>

    <div style="margin-bottom: 1rem; text-align: left;">
      <label>Precio:</label>
      <input [(ngModel)]="producto.precio" type="number" style="width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: white;">
    </div>

    <div style="margin-bottom: 1rem; text-align: left;">
      <label>Categoría:</label>
      <select [(ngModel)]="producto.categoria" style="width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: white;">
        <option value="camisetas">Camisetas</option>
        <option value="stickers">Stickers</option>
        <option value="posters">Posters</option>
      </select>
    </div>

    <div style="margin-bottom: 1rem; text-align: left;">
      <label>URL Imagen:</label>
      <input [(ngModel)]="producto.img" type="text" placeholder="https://..." style="width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: white;">
    </div>

    <button (click)="guardarProducto()" class="hero-btn" style="width: 100%; margin-top: 1rem;">
      Guardar en Firebase
    </button>

    <p *ngIf="mensaje" style="margin-top: 1rem; color: #27ae60; font-weight: bold;">{{ mensaje }}</p>

  </div>

</section>
