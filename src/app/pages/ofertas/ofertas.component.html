<section class="hero-ofertas">
  <div class="hero-content">
    <h1 class="hero-title">{{ textos['ofertas-titulo'] }}</h1>
  </div>
</section>

<section class="offers-section">
  <h2 class="section-title">{{ textos['ofertas-subtitulo'] }}</h2>

  <div class="offers-grid">
    <article class="offer-card" *ngFor="let oferta of listaOfertas">
      <div class="offer-image">
        <img [src]="oferta.img" [alt]="obtenerNombre(oferta)">
      </div>

      <div class="offer-body">
        <h3 class="offer-name">{{ obtenerNombre(oferta) }}</h3>

        <p class="offer-prices">
          <span class="old-price">COP {{ oferta.precioAntes | number }}</span>
          <span class="new-price">COP {{ oferta.precioAhora | number }}</span>
        </p>

        <button
          class="btn-tienda"
          (click)="agregarAlCarrito(oferta)">
          {{ textos['btn-agregar'] }}
        </button>
      </div>
    </article>
  </div>
</section>

<div id="notificacion-carrito" [class.activa]="notificacionVisible">
  <span id="notificacion-mensaje">{{ notificacionMensaje }}</span>
</div>
